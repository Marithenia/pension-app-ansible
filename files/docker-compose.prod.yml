services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pension_user
      POSTGRES_PASSWORD: pension_pass
      POSTGRES_DB: pension_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  citizen-service:
    image: docker.io/marithenia/citizen-service:latest
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pension_db
    restart: unless-stopped

  admin-service:
    image: docker.io/marithenia/admin-service:latest
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pension_db
    restart: unless-stopped

volumes:
  postgres_data:
