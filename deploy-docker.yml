---
- name: Install Docker and deploy pension-app stack
  hosts: pension-vm
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install prerequisite packages
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: true

    - name: Create app directory
      file:
        path: /home/azureuser/pension-app
        state: directory
        owner: azureuser
        mode: '0755'

    - name: Copy production docker-compose file
      copy:
        src: files/docker-compose.prod.yml
        dest: /home/azureuser/pension-app/docker-compose.yml
        owner: azureuser
        mode: '0644'

    - name: Pull latest images from Docker Hub
      command: docker compose pull
      args:
        chdir: /home/azureuser/pension-app

    - name: Start the stack
      command: docker compose up -d --force-recreate
      args:
        chdir: /home/azureuser/pension-app
