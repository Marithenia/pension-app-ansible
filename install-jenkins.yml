---
- name: Install Jenkins on the VM
  hosts: pension-vm
  become: true

  tasks:
    - name: Install Java 21 JRE (required by Jenkins)
      apt:
        name: openjdk-21-jre
        state: present
        update_cache: true

    - name: Add Jenkins GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        force: yes
        mode: '0644'

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Ensure Jenkins service is running and enabled
      service:
        name: jenkins
        state: started
        enabled: true

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: true

    - name: Restart Jenkins to apply docker group membership
      service:
        name: jenkins
        state: restarted
