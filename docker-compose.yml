services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pension_user
      POSTGRES_PASSWORD: pension_pass
      POSTGRES_DB: pension_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  citizen-service:
    build: ./citizen-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pension_db

  admin-service:
    build: ./admin-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pension_db

volumes:
  postgres_data: